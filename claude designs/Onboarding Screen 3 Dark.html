<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — Permissions</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    @keyframes mountIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes checkPop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes widgetFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-4px); }
    }
    @keyframes flamePulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.75; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── Icons ───────────────────────────────────────────────────────────── */
    function BellIcon({ color = '#FF8C00', size = 20 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      );
    }

    function PhoneIcon({ color = '#FF8C00', size = 20 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
      );
    }

    function ChevLeft({ color = '#1A1A1A', size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      );
    }

    function CheckIcon({ color = '#fff', size = 14 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      );
    }

    function FlameIcon({ size = 22 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="wfg" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#FFD966"/>
              <stop offset="100%" stopColor="#FF6500"/>
            </linearGradient>
          </defs>
          <path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"
            fill="url(#wfg)" stroke="none"/>
          <path d="M12 11c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z"
            fill="white" opacity="0.35" stroke="none"/>
        </svg>
      );
    }

    /* ── Permission card ─────────────────────────────────────────────────── */
    function PermCard({ icon, title, caption, btnLabel, filled, allowed, onAllow }) {
      const [pressed, setPressed] = useState(false);
      return (
        <div style={{
          background: '#2A2A2A',
          borderRadius: 16,
          border: '1.5px solid #383838',
          padding: '14px 16px',
          display: 'flex', alignItems: 'center', gap: 14,
          boxShadow: '0 1px 4px rgba(0,0,0,0.05)',
        }}>
          {/* Icon circle */}
          <div style={{
            width: 44, height: 44, borderRadius: 22, flexShrink: 0,
            background: '#CC6A00',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'none',
          }}>
            {icon}
          </div>

          {/* Text */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{
              fontSize: 15, fontWeight: 600, color: '#F5F5F5',
              fontFamily: 'DM Sans, sans-serif', lineHeight: 1.3,
            }}>{title}</p>
            <p style={{
              fontSize: 12.5, fontWeight: 400, color: '#666666',
              fontFamily: 'DM Sans, sans-serif', lineHeight: 1.4,
              marginTop: 2,
            }}>{caption}</p>
          </div>

          {/* Action button */}
          {allowed ? (
            <div style={{
              width: 30, height: 30, borderRadius: 15, flexShrink: 0,
              background: '#4CAF50',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              animation: 'checkPop 0.35s cubic-bezier(0.34,1.56,0.64,1)',
            }}>
              <CheckIcon />
            </div>
          ) : (
            <button
              onClick={onAllow}
              style={{
                flexShrink: 0,
                height: 34, padding: '0 14px',
                borderRadius: 17,
                border: filled ? 'none' : '1.5px solid #FF740D',
                background: filled
                  ? (pressed ? '#CC6000' : '#FF740D')
                  : (pressed ? 'rgba(255,116,13,0.08)' : 'transparent'),
                color: filled ? '#FFFFFF' : '#FF740D',
                fontSize: 13.5, fontWeight: 600,
                fontFamily: 'DM Sans, sans-serif',
                cursor: 'pointer',
                boxShadow: 'none',
                transition: 'background 0.15s, transform 0.1s',
                transform: pressed ? 'scale(0.95)' : 'scale(1)',
              }}
              onMouseDown={() => setPressed(true)}
              onMouseUp={() => setPressed(false)}
              onMouseLeave={() => setPressed(false)}
            >{btnLabel}</button>
          )}
        </div>
      );
    }

    /* ── Widget preview ──────────────────────────────────────────────────── */
    function WidgetPreview() {
      return (
        <div style={{
          display: 'flex', justifyContent: 'center',
          marginTop: 20,
        }}>
          {/* Phone home screen mockup context */}
          <div style={{
            background: '#252525',
            borderRadius: 22,
            padding: 16,
            width: 200,
            animation: 'widgetFloat 3.5s ease-in-out infinite',
            boxShadow: '0 4px 20px rgba(0,0,0,0.10)',
            border: '1px solid rgba(255,255,255,0.8)',
          }}>
            {/* iOS-like time */}
            <div style={{
              fontSize: 11, fontWeight: 500, color: 'rgba(255,255,255,0.3)',
              fontFamily: 'DM Sans, sans-serif',
              marginBottom: 10, textAlign: 'center', letterSpacing: 0.3,
            }}>HOME SCREEN</div>

            {/* 2×2 Widget */}
            <div style={{
              background: '#333333',
              borderRadius: 18,
              padding: '14px 16px',
              border: '1.5px solid rgba(255,116,13,0.25)',
              boxShadow: '0 2px 10px rgba(255,116,13,0.10), 0 1px 3px rgba(0,0,0,0.06)',
            }}>
              {/* Widget top row */}
              <div style={{
                display: 'flex', alignItems: 'center',
                justifyContent: 'space-between', marginBottom: 8,
              }}>
                <div style={{
                  fontSize: 10, fontWeight: 600, color: '#FF740D',
                  fontFamily: 'DM Sans, sans-serif', letterSpacing: 0.5,
                  textTransform: 'uppercase',
                }}>StreakUp</div>
                <FlameIcon size={16} />
              </div>

              {/* Habit name */}
              <div style={{
                fontSize: 13, fontWeight: 700, color: '#F5F5F5',
                fontFamily: 'DM Sans, sans-serif', lineHeight: 1.2,
                marginBottom: 6,
              }}>Morning Run</div>

              {/* Streak count */}
              <div style={{
                display: 'flex', alignItems: 'baseline', gap: 4,
              }}>
                <span style={{
                  fontSize: 28, fontWeight: 800, color: '#FF740D',
                  fontFamily: 'DM Sans, sans-serif', lineHeight: 1,
                  animation: 'flamePulse 2s ease-in-out infinite',
                }}>3</span>
                <span style={{
                  fontSize: 12, fontWeight: 500, color: '#888888',
                  fontFamily: 'DM Sans, sans-serif',
                }}>day streak</span>
              </div>

              {/* Mini day dots */}
              <div style={{
                display: 'flex', gap: 4, marginTop: 8,
              }}>
                {['S','M','T','W','T','F','S'].map((d, i) => (
                  <div key={i} style={{
                    flex: 1, display: 'flex', flexDirection: 'column',
                    alignItems: 'center', gap: 3,
                  }}>
                    <div style={{
                      width: '100%', height: 16, borderRadius: 4,
                      background: i < 3 ? '#FF740D' : 'rgba(255,255,255,0.10)',
                    }} />
                    <span style={{
                      fontSize: 7.5, color: i < 3 ? '#FF740D' : '#555555',
                      fontFamily: 'DM Sans, sans-serif', fontWeight: 600,
                    }}>{d}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Main screen ─────────────────────────────────────────────────────── */
    function PermissionsScreen() {
      const [notifAllowed, setNotifAllowed] = useState(false);
      const [widgetAllowed, setWidgetAllowed] = useState(false);
      const [mounted, setMounted] = useState(false);

      useEffect(() => { const t = setTimeout(() => setMounted(true), 60); return () => clearTimeout(t); }, []);

      const anim = (delay) => ({
        opacity:   mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(10px)',
        transition: `opacity 0.45s ease ${delay}ms, transform 0.45s ease ${delay}ms`,
      });

      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#1A1A1A',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
          paddingTop: 54,
        }}>

          {/* ── Top nav ── */}
          <div style={{
            display: 'flex', alignItems: 'center',
            justifyContent: 'space-between',
            padding: '10px 20px 0',
            ...anim(0),
          }}>
            <button style={{
              width: 38, height: 38, borderRadius: 11,
              border: '1.5px solid #333333', background: '#2A2A2A',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
            }}>
              <ChevLeft color="#F5F5F5" />
            </button>

            {/* Progress dots */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {[false, false, true].map((active, i) => (
                <div key={i} style={{
                  width: active ? 20 : 6, height: 6, borderRadius: 99,
                  background: active ? '#FF740D' : '#444444',
                }} />
              ))}
            </div>

            {/* Spacer to balance layout */}
            <div style={{ width: 38 }} />
          </div>

          {/* ── Heading ── */}
          <div style={{ padding: '22px 24px 0', textAlign: 'center', ...anim(100) }}>
            <h1 style={{
              fontFamily: 'DM Serif Display, serif',
              fontSize: 28, fontWeight: 400,
              color: '#F5F5F5', lineHeight: 1.2, letterSpacing: -0.3,
            }}>Never miss a day.</h1>
            <p style={{
              marginTop: 8, fontSize: 15, fontWeight: 400,
              color: '#666666', lineHeight: 1.5,
              fontFamily: 'DM Sans, sans-serif',
            }}>Set up reminders and keep your streak visible.</p>
          </div>

          {/* ── Permission cards ── */}
          <div style={{
            margin: '22px 20px 0',
            display: 'flex', flexDirection: 'column', gap: 12,
            ...anim(180),
          }}>
            <PermCard
              icon={<BellIcon color="#fff" size={19} />}
              title="Daily reminders"
              caption="We'll nudge you before midnight."
              btnLabel="Allow"
              filled={true}
              allowed={notifAllowed}
              onAllow={() => setNotifAllowed(true)}
            />
            <PermCard
              icon={<PhoneIcon color="#fff" size={19} />}
              title="Home screen widget"
              caption="See your streaks without opening the app."
              btnLabel="Set Up"
              filled={false}
              allowed={widgetAllowed}
              onAllow={() => setWidgetAllowed(true)}
            />
          </div>

          {/* ── Widget preview ── */}
          <div style={{ ...anim(280) }}>
            <WidgetPreview />
          </div>

          {/* ── Spacer ── */}
          <div style={{ flex: 1 }} />

          {/* ── CTA ── */}
          <div style={{
            padding: '0 24px 12px',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12,
            ...anim(380),
          }}>
            <button style={{
              width: '100%', height: 54, borderRadius: 27,
              border: 'none',
              background: '#FF740D',
              color: '#FFFFFF',
              fontSize: 16, fontWeight: 700,
              fontFamily: 'DM Sans, sans-serif',
              letterSpacing: 0.1,
              cursor: 'pointer',
              boxShadow: 'none',
              transition: 'transform 0.1s',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              whiteSpace: 'nowrap',
            }}
            onMouseDown={e => e.currentTarget.style.transform = 'scale(0.97)'}
            onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
            onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
            >
              All Done
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
            <p style={{
              fontSize: 12.5, fontWeight: 400, color: '#555555',
              fontFamily: 'DM Sans, sans-serif', textAlign: 'center',
              lineHeight: 1.4,
            }}>You can change these in Settings anytime</p>
          </div>

          {/* Safe area */}
          <div style={{ height: 12 }} />

        </div>
      );
    }

    /* ── Root ─────────────────────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%', background: '#111111',
        }}>
          <IOSDevice width={390} height={844} dark={true}>
            <PermissionsScreen />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
