<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — 2.7 Home: Multiple Habits None Completed (Dark)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    @keyframes fabPop {
      0%   { transform: scale(0.7); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes cardSlide {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes ringPop {
      0%   { transform: scale(1); }
      35%  { transform: scale(0.82); }
      70%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    @keyframes barFill {
      from { width: 0%; }
      to   { width: var(--bar-pct); }
    }

    /* Hide scrollbar in list */
    .habit-scroll::-webkit-scrollbar { display: none; }
    .habit-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Initial habit data ──────────────────────────────────────────────── */
    const HABITS_INIT = [
      { id: 1, icon: '🏃', name: 'Morning Run',   streak: 12, iconBg: '#3A2A1A', done: false },
      { id: 2, icon: '💧', name: 'Drink Water',   streak: 7,  iconBg: '#1A2A3A', done: false },
      { id: 3, icon: '📚', name: 'Read 20 pages', streak: 3,  iconBg: '#2E2A1A', done: false },
      { id: 4, icon: '🧘', name: 'Meditate',      streak: 0,  iconBg: '#252525', done: false },
    ];

    /* ── Nav icons ───────────────────────────────────────────────────────── */
    function NavFlame({ active }) {
      const c = active ? '#FF740D' : '#4A4A4A';
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"
            fill={active ? '#FF740D' : 'none'} stroke={c}
            strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          {active && <path d="M12 11c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z"
            fill="white" opacity="0.4"/>}
        </svg>
      );
    }
    function NavBar({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3"  y="3"  width="7" height="7" rx="1.5"/>
          <rect x="14" y="3"  width="7" height="7" rx="1.5"/>
          <rect x="3"  y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      );
    }
    function NavGear({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      );
    }

    /* ── Completion ring ─────────────────────────────────────────────────── */
    function CompletionRing({ done, onToggle, noStreak }) {
      const [popping, setPopping] = useState(false);
      const ringColor = noStreak ? '#4A4A4A' : '#FF8C00';

      const handleTap = () => {
        if (popping) return;
        setPopping(true);
        setTimeout(() => setPopping(false), 420);
        onToggle();
      };

      return (
        <div onClick={handleTap} style={{
          width: 44, height: 44,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0, cursor: 'pointer',
        }}>
          <div style={{
            width: 24, height: 24, borderRadius: '50%',
            border: done ? 'none' : `2.5px solid ${done ? ringColor : (noStreak ? '#4A4A4A' : '#FF8C00')}`,
            background: done ? (noStreak ? '#4A4A4A' : '#FF8C00') : 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background 0.22s ease',
            animation: popping ? 'ringPop 0.42s ease' : 'none',
          }}>
            {done && (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            )}
          </div>
        </div>
      );
    }

    /* ── Single habit card ───────────────────────────────────────────────── */
    function HabitCard({ habit, animDelay, onToggle }) {
      const [swipeX, setSwipeX]     = useState(0);
      const [dragging, setDragging] = useState(false);
      const startX = useRef(null);

      const isZeroStreak = habit.streak === 0;

      const onTouchStart = (e) => { startX.current = e.touches[0].clientX; setDragging(true); };
      const onTouchMove  = (e) => {
        if (startX.current === null) return;
        setSwipeX(Math.max(0, Math.min(e.touches[0].clientX - startX.current, 80)));
      };
      const onTouchEnd = () => {
        if (swipeX > 52) onToggle();
        setSwipeX(0); setDragging(false); startX.current = null;
      };

      return (
        <div style={{
          position: 'relative', borderRadius: 16, overflow: 'hidden',
          opacity: isZeroStreak ? 0.85 : 1,
          animation: `cardSlide 0.36s cubic-bezier(0.22,1,0.36,1) ${animDelay}ms both`,
        }}>
          {/* Swipe bg */}
          <div style={{
            position: 'absolute', inset: 0, borderRadius: 16,
            background: 'linear-gradient(90deg,#4CAF50,#43A047)',
            display: 'flex', alignItems: 'center', paddingLeft: 20,
          }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="white" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>

          {/* Card surface */}
          <div
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
            style={{
              position: 'relative', zIndex: 1,
              background: isZeroStreak ? '#252525' : '#2A2A2A',
              borderRadius: 16,
              border: '1.5px solid #383838',
              padding: '13px 12px 13px 14px',
              display: 'flex', alignItems: 'center', gap: 12,
              boxShadow: '0 2px 12px rgba(0,0,0,0.28)',
              transform: `translateX(${swipeX}px)`,
              transition: dragging ? 'none' : 'transform 0.28s cubic-bezier(0.22,1,0.36,1)',
            }}
          >
            {/* Emoji badge */}
            <div style={{
              width: 44, height: 44, borderRadius: 12,
              background: isZeroStreak ? '#303030' : habit.iconBg,
              flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 21,
              filter: isZeroStreak ? 'grayscale(0.4)' : 'none',
            }}>
              {habit.icon}
            </div>

            {/* Text */}
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{
                fontSize: 15, fontWeight: 700,
                color: isZeroStreak ? '#666666' : '#F5F5F5',
                fontFamily: 'DM Sans, sans-serif',
                lineHeight: 1.25,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{habit.name}</p>

              {isZeroStreak ? (
                <p style={{
                  fontSize: 12, fontWeight: 500,
                  color: '#9E9E9E',
                  fontFamily: 'DM Sans, sans-serif',
                  marginTop: 3,
                }}>Start your streak!</p>
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', gap: 3, marginTop: 3 }}>
                  <span style={{ fontSize: 13, lineHeight: 1 }}>🔥</span>
                  <span style={{
                    fontSize: 12.5, fontWeight: 500,
                    color: '#FF8C00',
                    fontFamily: 'DM Sans, sans-serif',
                  }}>{habit.streak} day streak</span>
                </div>
              )}
            </div>

            {/* Ring */}
            <CompletionRing
              done={habit.done}
              onToggle={onToggle}
              noStreak={isZeroStreak}
            />
          </div>
        </div>
      );
    }

    /* ── Home screen ─────────────────────────────────────────────────────── */
    function HomeScreen() {
      const [mounted, setMounted] = useState(false);
      const [habits,  setHabits]  = useState(HABITS_INIT);

      useEffect(() => {
        const t = setTimeout(() => setMounted(true), 60);
        return () => clearTimeout(t);
      }, []);

      const toggleHabit = (id) =>
        setHabits(hs => hs.map(h => h.id === id ? { ...h, done: !h.done } : h));

      const completed = habits.filter(h => h.done).length;
      const total     = habits.length;
      const pct       = (completed / total) * 100;

      const anim = (delayMs) => ({
        opacity:   mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(10px)',
        transition: `opacity 0.42s ease ${delayMs}ms, transform 0.42s ease ${delayMs}ms`,
      });

      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#1A1A1A',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
          paddingTop: 54,
          position: 'relative',
          fontFamily: 'DM Sans, sans-serif',
        }}>

          {/* ── Header ────────────────────────────── */}
          <div style={{
            display: 'flex', alignItems: 'center',
            justifyContent: 'space-between',
            padding: '14px 20px 0',
            flexShrink: 0,
            ...anim(0),
          }}>
            <div>
              <p style={{
                fontSize: 12.5, fontWeight: 500,
                color: '#666666', marginBottom: 2, letterSpacing: 0.1,
              }}>Monday, May 12</p>
              <h2 style={{
                fontFamily: 'DM Serif Display, serif',
                fontSize: 22, fontWeight: 400,
                color: '#F5F5F5', lineHeight: 1.2,
              }}>Good morning 👋</h2>
            </div>
            <div style={{
              width: 42, height: 42, borderRadius: 21,
              background: '#FF740D', flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: '#FFFFFF' }}>A</span>
            </div>
          </div>

          {/* ── Progress summary card ─────────────── */}
          <div style={{
            margin: '14px 20px 0',
            background: '#2A2A2A',
            borderRadius: 16,
            border: '1.5px solid #333333',
            padding: '13px 16px',
            flexShrink: 0,
            ...anim(90),
          }}>
            <div style={{
              display: 'flex', justifyContent: 'space-between',
              alignItems: 'baseline', marginBottom: 9,
            }}>
              <p style={{ fontSize: 14.5, fontWeight: 600, color: '#F5F5F5' }}>
                {completed} of {total} done today
              </p>
              <span style={{
                fontSize: 12.5, fontWeight: 500,
                color: completed === total ? '#4CAF50' : '#FF8C00',
                transition: 'color 0.3s',
              }}>
                {completed === total ? 'All done! 🎉' : 'Keep going'}
              </span>
            </div>
            <div style={{ height: 4, borderRadius: 99, background: '#444444', overflow: 'hidden' }}>
              <div style={{
                height: '100%', borderRadius: 99, background: '#FF8C00',
                width: `${pct}%`,
                transition: 'width 0.5s cubic-bezier(0.34,1.56,0.64,1)',
                minWidth: pct > 0 ? 4 : 0,
              }} />
            </div>
          </div>

          {/* ── Section label ─────────────────────── */}
          <div style={{ padding: '18px 20px 10px', flexShrink: 0, ...anim(140) }}>
            <p style={{
              fontSize: 10.5, fontWeight: 600,
              color: '#555555', letterSpacing: 0.9,
              textTransform: 'uppercase',
            }}>Today — {total} habits</p>
          </div>

          {/* ── Scrollable habit list ─────────────── */}
          <div className="habit-scroll" style={{
            flex: 1,
            overflowY: 'auto',
            paddingBottom: 96,
          }}>
            <div style={{
              padding: '0 20px',
              display: 'flex', flexDirection: 'column', gap: 12,
            }}>
              {habits.map((h, i) => (
                <HabitCard
                  key={h.id}
                  habit={h}
                  animDelay={180 + i * 55}
                  onToggle={() => toggleHabit(h.id)}
                />
              ))}
            </div>
          </div>

          {/* ── Bottom nav ────────────────────────── */}
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            height: 82,
            background: '#1A1A1A',
            borderTop: '1px solid #2E2E2E',
            display: 'flex', alignItems: 'flex-start',
            justifyContent: 'space-around',
            paddingTop: 12,
            zIndex: 10,
          }}>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavFlame active={true} />
              <span style={{ fontSize: 10.5, fontWeight: 600, color: '#FF740D' }}>Home</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavBar color="#4A4A4A" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#4A4A4A' }}>Stats</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavGear color="#4A4A4A" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#4A4A4A' }}>Settings</span>
            </button>
          </div>

          {/* ── FAB ───────────────────────────────── */}
          <button style={{
            position: 'absolute', bottom: 96, right: 20,
            width: 56, height: 56, borderRadius: 28,
            background: '#FF740D',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            animation: 'fabPop 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.35s both',
            zIndex: 20,
          }}
          onMouseDown={e => e.currentTarget.style.transform = 'scale(0.92)'}
          onMouseUp={e   => e.currentTarget.style.transform = 'scale(1)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="white" strokeWidth="2.6" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>

        </div>
      );
    }

    /* ── Root ─────────────────────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%',
          background: '#111111',
        }}>
          <IOSDevice width={390} height={844} dark={true}>
            <HomeScreen />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
