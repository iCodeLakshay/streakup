<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — 2.12 Home → Habit Detail Transition</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #D8D4CF;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    .habit-scroll::-webkit-scrollbar { display: none; }
    .habit-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    /* ── Nav icons ─────────────────────────────────────────────── */
    function NavFlame({ active }) {
      const c = active ? '#FF740D' : '#BDBDBD';
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"
            fill={active ? '#FF740D' : 'none'} stroke={c}
            strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          {active && <path d="M12 11c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z" fill="white" opacity="0.4"/>}
        </svg>
      );
    }
    function NavBar({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3"  y="3"  width="7" height="7" rx="1.5"/>
          <rect x="14" y="3"  width="7" height="7" rx="1.5"/>
          <rect x="3"  y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      );
    }
    function NavGear({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      );
    }

    /* ── Static habit card (no swipe) ─────────────────────────── */
    function StaticHabitCard({ icon, iconBg, name, streak, done, highlighted }) {
      const isZero = streak === 0;
      return (
        <div style={{
          borderRadius: 16,
          background: done ? '#F0FFF4' : '#FFFFFF',
          border: highlighted ? '2px solid #FF740D'
            : done ? '1.5px solid #BBF7D0' : '1.5px solid #F0EDE8',
          borderLeft: done
            ? '4px solid #22C55E'
            : highlighted ? '2px solid #FF740D' : '1.5px solid #F0EDE8',
          padding: '13px 12px 13px 14px',
          display: 'flex', alignItems: 'center', gap: 12,
          boxShadow: highlighted
            ? '0 0 0 3px rgba(255,116,13,0.10), 0 4px 16px rgba(255,116,13,0.18)'
            : '0 2px 10px rgba(0,0,0,0.06)',
          transform: highlighted ? 'scale(1.02)' : 'none',
          opacity: done ? 0.72 : (isZero ? 0.85 : 1),
          position: 'relative', zIndex: highlighted ? 2 : 1,
        }}>
          <div style={{
            width: 44, height: 44, borderRadius: 12,
            background: done ? '#D1FAE5' : (isZero ? '#F5F5F5' : iconBg),
            flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 21,
          }}>{icon}</div>

          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{
              fontSize: 15, fontWeight: 700,
              color: isZero ? '#888888' : '#1A1A1A', lineHeight: 1.25,
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            }}>{name}</p>
            {isZero ? (
              <p style={{ fontSize: 12, fontWeight: 500, color: '#BDBDBD', marginTop: 3 }}>
                Start your streak!
              </p>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: 3, marginTop: 3 }}>
                <span style={{ fontSize: 13, lineHeight: 1 }}>🔥</span>
                <span style={{ fontSize: 12.5, fontWeight: 500, color: '#FF740D' }}>
                  {streak} day streak
                </span>
              </div>
            )}
          </div>

          <div style={{
            width: done ? 28 : 24, height: done ? 28 : 24, borderRadius: '50%',
            background: done ? '#22C55E' : 'transparent',
            border: done ? 'none' : `2.5px solid ${isZero ? '#BDBDBD' : '#FF740D'}`,
            flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            {done && (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            )}
          </div>
        </div>
      );
    }

    /* ── Home screen ───────────────────────────────────────────── */
    function HomeScreen() {
      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#FFFFFF',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden', paddingTop: 54,
          fontFamily: 'DM Sans, sans-serif', position: 'relative',
        }}>
          {/* Header */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '14px 20px 0', flexShrink: 0,
          }}>
            <div>
              <p style={{ fontSize: 12.5, fontWeight: 500, color: '#BDBDBD', marginBottom: 2 }}>
                Monday, May 12
              </p>
              <h2 style={{
                fontFamily: 'DM Serif Display, serif',
                fontSize: 22, fontWeight: 400, color: '#1A1A1A', lineHeight: 1.2,
              }}>Good morning 👋</h2>
            </div>
            <div style={{
              width: 42, height: 42, borderRadius: 21, background: '#FF740D', flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: '#FFFFFF' }}>A</span>
            </div>
          </div>

          {/* Progress card */}
          <div style={{
            margin: '14px 20px 0', background: '#FFF8F0', borderRadius: 16,
            border: '1.5px solid rgba(255,116,13,0.13)', padding: '13px 16px', flexShrink: 0,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 9 }}>
              <p style={{ fontSize: 14.5, fontWeight: 600, color: '#1A1A1A' }}>2 of 4 done today</p>
              <span style={{ fontSize: 12.5, fontWeight: 500, color: '#FF740D' }}>Keep going</span>
            </div>
            <div style={{ height: 4, borderRadius: 99, background: '#F0EDE8', overflow: 'hidden' }}>
              <div style={{ height: '100%', borderRadius: 99, background: '#FF740D', width: '50%' }} />
            </div>
          </div>

          {/* Habit list */}
          <div className="habit-scroll" style={{ flex: 1, overflowY: 'auto', paddingBottom: 96 }}>
            <div style={{ padding: '16px 20px 0', display: 'flex', flexDirection: 'column', gap: 12 }}>
              <StaticHabitCard icon="📚" iconBg="#FFF5E8" name="Read 20 pages" streak={3} done={false} highlighted={false} />
              <StaticHabitCard icon="🧘" iconBg="#F3F0FF" name="Meditate" streak={0} done={false} highlighted={false} />
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '4px 0' }}>
                <div style={{ flex: 1, height: 1, background: '#F0EDE8' }} />
                <span style={{ fontSize: 11, fontWeight: 500, color: '#C5BFB8', letterSpacing: 0.3 }}>Completed today ✓</span>
                <div style={{ flex: 1, height: 1, background: '#F0EDE8' }} />
              </div>
              {/* Morning Run — highlighted as the tapped card */}
              <StaticHabitCard icon="🏃" iconBg="#FFF0E0" name="Morning Run" streak={13} done={true} highlighted={true} />
              <StaticHabitCard icon="💧" iconBg="#E8F4FF" name="Drink Water" streak={8} done={true} highlighted={false} />
            </div>
          </div>

          {/* Bottom nav */}
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            height: 82, background: '#FFFFFF', borderTop: '1px solid #F0EDE8',
            display: 'flex', alignItems: 'flex-start', justifyContent: 'space-around',
            paddingTop: 12, zIndex: 10,
          }}>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavFlame active={true} />
              <span style={{ fontSize: 10.5, fontWeight: 600, color: '#FF740D' }}>Home</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavBar color="#BDBDBD" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#BDBDBD' }}>Stats</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavGear color="#BDBDBD" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#BDBDBD' }}>Settings</span>
            </button>
          </div>

          {/* FAB */}
          <button style={{
            position: 'absolute', bottom: 96, right: 20,
            width: 56, height: 56, borderRadius: 28, background: '#FF740D',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 20,
          }}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="white" strokeWidth="2.6" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>
      );
    }

    /* ── Habit Detail screen ───────────────────────────────────── */
    function HabitDetailScreen() {
      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#FFFFFF',
          display: 'flex', flexDirection: 'column',
          paddingTop: 54,
          fontFamily: 'DM Sans, sans-serif',
        }}>
          {/* Nav bar */}
          <div style={{
            display: 'flex', alignItems: 'center',
            padding: '12px 16px',
            borderBottom: '1px solid #F0EDE8',
            flexShrink: 0, position: 'relative',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer' }}>
              <svg width="10" height="17" viewBox="0 0 10 17" fill="none"
                stroke="#FF740D" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 1L1 8.5L9 16"/>
              </svg>
              <span style={{ fontSize: 16, fontWeight: 400, color: '#FF740D' }}>Home</span>
            </div>
            <p style={{
              position: 'absolute', left: 0, right: 0, textAlign: 'center',
              fontSize: 16, fontWeight: 600, color: '#1A1A1A', pointerEvents: 'none',
            }}>Morning Run</p>
          </div>

          {/* Hero */}
          <div style={{
            padding: '22px 20px 18px',
            display: 'flex', alignItems: 'center', gap: 16,
            background: '#FFF8F0', borderBottom: '1px solid #F0EDE8',
          }}>
            <div style={{
              width: 58, height: 58, borderRadius: 16,
              background: '#FFF0E0',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28,
            }}>🏃</div>
            <div>
              <p style={{ fontSize: 19, fontWeight: 700, color: '#1A1A1A', lineHeight: 1.2 }}>Morning Run</p>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 5 }}>
                <span style={{ fontSize: 15 }}>🔥</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: '#FF740D' }}>13 day streak</span>
              </div>
            </div>
          </div>

          {/* Stats row */}
          <div style={{ display: 'flex', borderBottom: '1px solid #F0EDE8' }}>
            {[['Best','21 days'],['This month','11/12'],['All time','47 days']].map(([label, value], i) => (
              <div key={i} style={{
                flex: 1, padding: '14px 0', textAlign: 'center',
                borderRight: i < 2 ? '1px solid #F0EDE8' : 'none',
              }}>
                <p style={{ fontSize: 16, fontWeight: 700, color: '#1A1A1A' }}>{value}</p>
                <p style={{ fontSize: 11, fontWeight: 400, color: '#BDBDBD', marginTop: 2 }}>{label}</p>
              </div>
            ))}
          </div>

          {/* Weekly grid */}
          <div style={{ padding: '18px 20px' }}>
            <p style={{ fontSize: 11.5, fontWeight: 600, color: '#C5BFB8', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 12 }}>
              This week
            </p>
            <div style={{ display: 'flex', gap: 8 }}>
              {['M','T','W','T','F','S','S'].map((d, i) => (
                <div key={i} style={{ flex: 1, textAlign: 'center' }}>
                  <div style={{
                    height: 36, borderRadius: 8,
                    background: i < 5 ? '#FF740D' : '#F0EDE8',
                    marginBottom: 4,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {i < 5 && (
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
                        stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                      </svg>
                    )}
                  </div>
                  <span style={{ fontSize: 10, color: '#BDBDBD', fontWeight: 500 }}>{d}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ── Transition wrapper — 60% progress ────────────────────── */
    function TransitionScene() {
      const W        = 390;
      const progress = 0.60;                        // 60% through push transition
      const homeOff  = -(W * progress * 0.28);      // ≈ −65px parallax
      const detailOff = W * (1 - progress);         // 156px — 60% of screen visible

      return (
        <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden' }}>

          {/* Home — pushed left with iOS parallax */}
          <div style={{
            position: 'absolute', inset: 0,
            transform: `translateX(${homeOff}px)`,
          }}>
            <HomeScreen />
          </div>

          {/* Scrim over home as detail covers it */}
          <div style={{
            position: 'absolute', top: 0, bottom: 0,
            left: 0, right: `${W - detailOff}px`,
            background: 'rgba(0,0,0,0.10)',
            pointerEvents: 'none', zIndex: 5,
          }} />

          {/* Detail — sliding in from right */}
          <div style={{
            position: 'absolute', top: 0, bottom: 0,
            left: 0, width: W,
            transform: `translateX(${detailOff}px)`,
            boxShadow: '-10px 0 28px rgba(0,0,0,0.16)',
            zIndex: 10,
          }}>
            <HabitDetailScreen />
          </div>

        </div>
      );
    }

    /* ── Root ──────────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%', background: '#D8D4CF',
        }}>
          <IOSDevice width={390} height={844} dark={false}>
            <TransitionScene />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
