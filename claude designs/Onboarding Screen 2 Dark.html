<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — Create First Habit</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    input, textarea {
      font-family: 'DM Sans', sans-serif;
      outline: none; border: none; background: transparent; resize: none;
    }
    input::placeholder, textarea::placeholder { color: #555555; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { scrollbar-width: none; }

    @keyframes mountIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes chipTap {
      0%   { transform: scale(1); }
      45%  { transform: scale(0.94); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── Icon library (pure SVG, 24×24 grid, 1.8px stroke) ────────────────── */
    const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.8 }) => {
      const s = { width: size, height: size, display: 'block', flexShrink: 0 };
      const paths = {
        run:      <><path d="M13 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/><path d="M7.5 17.5 10 13l3 2 2-5.5"/><path d="M5 10.5c2-1.5 4-.5 5.5 0s3.5.5 5-1"/></>,
        drop:     <><path d="M12 3C12 3 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-6-11-6-11z"/></>,
        book:     <><path d="M4 19V5a2 2 0 0 1 2-2h12v14"/><path d="M4 19a2 2 0 0 0 2 2h12"/><path d="M9 7h6M9 11h4"/></>,
        lotus:    <><path d="M12 17c0-4-3-7-7-5 0 3 3 5 7 5z"/><path d="M12 17c0-4 3-7 7-5 0 3-3 5-7 5z"/><path d="M12 17V9"/><path d="M12 9c0-3-2-5-5-4 0 2 2 4 5 4z"/><path d="M12 9c0-3 2-5 5-4 0 2-2 4-5 4z"/></>,
        dumbbell: <><path d="M6 9h12M6 15h12"/><rect x="3" y="7" width="3" height="10" rx="1.5"/><rect x="18" y="7" width="3" height="10" rx="1.5"/><rect x="7" y="11" width="2" height="2" rx="1"/><rect x="15" y="11" width="2" height="2" rx="1"/></>,
        salad:    <><ellipse cx="12" cy="13" rx="9" ry="5"/><path d="M12 13V8"/><path d="M8 9c1-2 4-3 6-1"/><path d="M16 9c-1-2-4-3-6-1"/></>,
        moon:     <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>,
        pen:      <><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>,
        chevLeft: <path d="M15 18l-6-6 6-6"/>,
        close:    <path d="M18 6L6 18M6 6l12 12"/>,
        flame:    <><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"/><path d="M12 12c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z" fill={color} opacity="0.4"/></>,
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={color}
          strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={s}>
          {paths[name]}
        </svg>
      );
    };

    /* ── Habit categories ──────────────────────────────────────────────────── */
    const HABITS = [
      { key: 'run',      icon: 'run',      label: 'Morning Run',   note: 'Start the day strong' },
      { key: 'drop',     icon: 'drop',     label: 'Hydrate',       note: '8 glasses a day' },
      { key: 'book',     icon: 'book',     label: 'Read',          note: '20 pages minimum' },
      { key: 'lotus',    icon: 'lotus',    label: 'Meditate',      note: '10 minutes, eyes closed' },
      { key: 'dumbbell', icon: 'dumbbell', label: 'Exercise',      note: 'Move every day' },
      { key: 'salad',    icon: 'salad',    label: 'Eat clean',     note: 'No junk food' },
      { key: 'moon',     icon: 'moon',     label: 'Sleep early',   note: 'Lights out by 10pm' },
      { key: 'pen',      icon: 'pen',      label: 'Journal',       note: 'Write it out' },
    ];

    /* ── Main screen ───────────────────────────────────────────────────────── */
    function HabitScreen() {
      const [habitName, setHabitName]     = useState('Morning Run');
      const [note, setNote]               = useState('Start the day strong');
      const [selectedKey, setSelectedKey] = useState('run');
      const [mounted, setMounted]         = useState(false);

      useEffect(() => { const t = setTimeout(() => setMounted(true), 60); return () => clearTimeout(t); }, []);

      const canCreate = habitName.trim().length > 0;
      const selectedHabit = HABITS.find(h => h.key === selectedKey);

      const anim = (delay) => ({
        opacity:   mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(10px)',
        transition: `opacity 0.45s ease ${delay}ms, transform 0.45s ease ${delay}ms`,
      });

      const handleSelect = (h) => {
        setSelectedKey(h.key);
        setHabitName(h.label);
        setNote(h.note);
      };

      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#1A1A1A',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
          paddingTop: 54,
        }}>

          {/* ── Top nav ── */}
          <div style={{
            display: 'flex', alignItems: 'center',
            justifyContent: 'space-between',
            padding: '10px 20px 0',
            ...anim(0),
          }}>
            <button style={{
              width: 38, height: 38, borderRadius: 11,
              border: '1.5px solid #333333',
              background: '#2A2A2A',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', color: '#F5F5F5',
            }}>
              <Icon name="chevLeft" size={18} color="#F5F5F5" />
            </button>

            {/* Progress dots */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {[false, true, false].map((active, i) => (
                <div key={i} style={{
                  width: active ? 20 : 6, height: 6, borderRadius: 99,
                  background: active ? '#FF8C00' : '#333333',
                  transition: 'width 0.3s ease',
                }} />
              ))}
            </div>

            <button style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontSize: 15, fontWeight: 500, color: '#BDBDBD',
              fontFamily: 'DM Sans, sans-serif', letterSpacing: 0.1,
            }}>Skip</button>
          </div>

          {/* ── Heading ── */}
          <div style={{ padding: '22px 24px 0', ...anim(100) }}>
            <h1 style={{
              fontFamily: 'DM Serif Display, serif',
              fontSize: 26, fontWeight: 400,
              color: '#F5F5F5', lineHeight: 1.25,
              letterSpacing: -0.2,
            }}>What habit will<br/>you build?</h1>
            <p style={{
              marginTop: 6, fontSize: 14.5, fontWeight: 400,
              color: '#666666', lineHeight: 1.5,
              fontFamily: 'DM Sans, sans-serif',
            }}>Start with one. You can add more later.</p>
          </div>

          {/* ── Input card ── */}
          <div style={{
            margin: '18px 20px 0',
            background: '#2A2A2A',
            borderRadius: 16,
            border: '1.5px solid #383838',
            overflow: 'hidden',
            ...anim(180),
          }}>
            {/* Icon + name row */}
            <div style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '14px 16px',
              borderBottom: '1px solid #333333',
            }}>
              {/* Icon badge */}
              <div style={{
                width: 42, height: 42, borderRadius: 12,
                background: 'rgba(255,140,0,0.15)',
                border: '1.5px solid rgba(255,140,0,0.35)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                flexShrink: 0,
                color: '#FF8C00',
              }}>
                <Icon name={selectedHabit?.icon || 'flame'} size={19} color="#FF8C00" />
              </div>

              {/* Name input */}
              <input
                type="text"
                value={habitName}
                onChange={e => setHabitName(e.target.value)}
                placeholder="Habit name..."
                style={{
                  flex: 1, fontSize: 16, fontWeight: 600,
                  color: '#F5F5F5', lineHeight: '24px',
                  caretColor: '#FF8C00',
                }}
              />

              {/* Clear */}
              {habitName.length > 0 && (
                <button onClick={() => setHabitName('')} style={{
                  width: 20, height: 20, borderRadius: 10,
                  background: '#444444', border: 'none', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0, color: '#999',
                }}>
                  <Icon name="close" size={10} color="#AAAAAA" strokeWidth={2.2} />
                </button>
              )}
            </div>

            {/* Note row */}
            <div style={{ padding: '10px 16px 12px', paddingLeft: 70 }}>
              <input
                type="text"
                value={note}
                onChange={e => setNote(e.target.value)}
                placeholder="Add a note (optional)"
                style={{
                  width: '100%', fontSize: 13.5, fontWeight: 400,
                  color: '#777777', lineHeight: '20px',
                  caretColor: '#FF8C00',
                }}
              />
            </div>
          </div>

          {/* ── Icon quick-pick ── */}
          <div style={{ marginTop: 14, ...anim(260) }}>
            <div
              className="no-scroll"
              style={{
                display: 'flex', gap: 8,
                overflowX: 'auto',
                padding: '2px 20px 6px',
              }}
            >
              {HABITS.map((h) => {
                const active = h.key === selectedKey;
                return (
                  <button
                    key={h.key}
                    onClick={() => handleSelect(h)}
                    style={{
                      flexShrink: 0,
                      width: 48, height: 48,
                      borderRadius: 13,
                      border: active ? '1.5px solid #FF8C00' : '1.5px solid #383838',
                      background: active ? '#FF8C00' : '#333333',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      cursor: 'pointer',
                      color: active ? '#FFFFFF' : '#666666',
                      transition: 'border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s',
                    }}
                    onMouseDown={e => e.currentTarget.style.transform = 'scale(0.9)'}
                    onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
                    onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                  >
                    <Icon name={h.icon} size={20} color={active ? '#FFFFFF' : '#666666'} />
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Preset chips ── */}
          <div style={{ padding: '10px 20px 0', ...anim(340) }}>
            <p style={{
              fontSize: 11, fontWeight: 600, color: '#555555',
              letterSpacing: 0.8, textTransform: 'uppercase',
              marginBottom: 10, fontFamily: 'DM Sans, sans-serif',
            }}>Quick picks</p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
              {HABITS.slice(0, 5).map((h) => {
                const active = h.key === selectedKey;
                return (
                  <button
                    key={h.key}
                    onClick={() => handleSelect(h)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 6,
                      height: 34, padding: '0 12px',
                      borderRadius: 99,
                      border: active ? '1.5px solid #FF8C00' : '1.5px solid #383838',
                      background: active ? 'rgba(255,140,0,0.15)' : '#333333',
                      fontSize: 13.5, fontWeight: 500,
                      color: active ? '#FF8C00' : '#9E9E9E',
                      cursor: 'pointer',
                      transition: 'all 0.15s ease',
                      fontFamily: 'DM Sans, sans-serif',
                    }}
                    onMouseDown={e => e.currentTarget.style.transform = 'scale(0.93)'}
                    onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
                    onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                  >
                    <Icon name={h.icon} size={14} color={active ? '#FF8C00' : '#666666'} strokeWidth={2} />
                    {h.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Spacer ── */}
          <div style={{ flex: 1 }} />

          {/* ── CTA ── */}
          <div style={{ padding: '0 24px 46px', ...anim(420) }}>
            <button
              disabled={!canCreate}
              style={{
                width: '100%', height: 54, borderRadius: 27,
                border: 'none',
                background: canCreate
                  ? 'linear-gradient(160deg, #FFB347 0%, #FF6500 100%)'
                  : '#2A2A2A',
                color: canCreate ? '#FFFFFF' : '#555555',
                fontSize: 16, fontWeight: 700,
                fontFamily: 'DM Sans, sans-serif',
                letterSpacing: 0.1,
                cursor: canCreate ? 'pointer' : 'not-allowed',
                /* Tight, natural shadow — not "AI generated" */
                boxShadow: canCreate
                  ? '0 2px 8px rgba(255,101,0,0.25)'
                  : 'none',
                transition: 'background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s',
                position: 'relative', overflow: 'hidden',
              }}
              onMouseEnter={e => { if (canCreate) e.currentTarget.style.transform = 'scale(0.99)'; }}
              onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
              onMouseDown={e => { if (canCreate) e.currentTarget.style.transform = 'scale(0.97)'; }}
              onMouseUp={e => { if (canCreate) e.currentTarget.style.transform = 'scale(0.99)'; }}
            >
              Create My First Habit
            </button>
          </div>

        </div>
      );
    }

    /* ── Root ──────────────────────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%', background: '#111111',
        }}>
          <IOSDevice width={390} height={844} dark={true}>
            <HabitScreen />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
