<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — Icon Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    input { font-family: 'DM Sans', sans-serif; outline: none; border: none; background: transparent; }
    input::placeholder { color: #555555; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { scrollbar-width: none; }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes scrimIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes mountIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Icon library ─────────────────────────────────────────────────────── */
    const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.8 }) => {
      const s = { width: size, height: size, display: 'block', flexShrink: 0 };
      const paths = {
        run:       <><path d="M13 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/><path d="M7.5 17.5 10 13l3 2 2-5.5"/><path d="M5 10.5c2-1.5 4-.5 5.5 0s3.5.5 5-1"/></>,
        drop:      <path d="M12 3C12 3 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-6-11-6-11z"/>,
        book:      <><path d="M4 19V5a2 2 0 0 1 2-2h12v14"/><path d="M4 19a2 2 0 0 0 2 2h12"/><path d="M9 7h6M9 11h4"/></>,
        lotus:     <><path d="M12 17c0-4-3-7-7-5 0 3 3 5 7 5z"/><path d="M12 17c0-4 3-7 7-5 0 3-3 5-7 5z"/><path d="M12 17V9"/><path d="M12 9c0-3-2-5-5-4 0 2 2 4 5 4z"/><path d="M12 9c0-3 2-5 5-4 0 2-2 4-5 4z"/></>,
        dumbbell:  <><path d="M6 9h12M6 15h12"/><rect x="3" y="7" width="3" height="10" rx="1.5"/><rect x="18" y="7" width="3" height="10" rx="1.5"/><rect x="7" y="11" width="2" height="2" rx="1"/><rect x="15" y="11" width="2" height="2" rx="1"/></>,
        salad:     <><ellipse cx="12" cy="13" rx="9" ry="5"/><path d="M12 13V8"/><path d="M8 9c1-2 4-3 6-1"/><path d="M16 9c-1-2-4-3-6-1"/></>,
        moon:      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>,
        pen:       <><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>,
        flame:     <><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"/><path d="M12 12c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z" fill={color} opacity="0.4"/></>,
        heart:     <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>,
        sun:       <><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></>,
        bike:      <><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 18L9 6h6l3 12"/><path d="M9 6h6"/><path d="M15 6l3 12"/></>,
        leaf:      <path d="M17 8C8 10 5.9 16.17 3.82 20.98M9.5 9.5s1.5-3 6.5-4.5c0 6-3 9-9.5 10.5"/>,
        timer:     <><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 3"/><path d="M10 3h4"/><path d="M12 3v2"/></>,
        zap:       <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>,
        star:      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>,
        music:     <><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></>,
        coffee:    <><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><path d="M6 1v3M10 1v3M14 1v3"/></>,
        camera:    <><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>,
        smile:     <><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>,
        target:    <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
        trending:  <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
        shield:    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
        wind:      <><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></>,
        search:    <><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></>,
        chevLeft:  <path d="M15 18l-6-6 6-6"/>,
        close:     <path d="M18 6L6 18M6 6l12 12"/>,
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke={color}
          strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={s}>
          {paths[name]}
        </svg>
      );
    };

    /* ── Icon catalogue by category ────────────────────────────────────────── */
    const CATALOGUE = {
      Activity: [
        { key:'run',      icon:'run',      label:'Run'      },
        { key:'bike',     icon:'bike',     label:'Cycle'    },
        { key:'dumbbell', icon:'dumbbell', label:'Lift'     },
        { key:'heart',    icon:'heart',    label:'Cardio'   },
        { key:'target',   icon:'target',   label:'Goals'    },
        { key:'zap',      icon:'zap',      label:'Energy'   },
        { key:'timer',    icon:'timer',    label:'Timer'    },
        { key:'trending', icon:'trending', label:'Progress' },
        { key:'shield',   icon:'shield',   label:'Protect'  },
        { key:'wind',     icon:'wind',     label:'Breathe'  },
      ],
      Food: [
        { key:'salad',    icon:'salad',    label:'Salad'    },
        { key:'drop',     icon:'drop',     label:'Water'    },
        { key:'coffee',   icon:'coffee',   label:'Coffee'   },
        { key:'leaf',     icon:'leaf',     label:'Greens'   },
        { key:'sun',      icon:'sun',      label:'Morning'  },
        { key:'star',     icon:'star',     label:'Reward'   },
        { key:'smile',    icon:'smile',    label:'Happy'    },
        { key:'heart',    icon:'heart',    label:'Love'     },
        { key:'wind',     icon:'wind',     label:'Air'      },
        { key:'zap',      icon:'zap',      label:'Boost'    },
      ],
      Mind: [
        { key:'lotus',    icon:'lotus',    label:'Meditate' },
        { key:'moon',     icon:'moon',     label:'Sleep'    },
        { key:'music',    icon:'music',    label:'Music'    },
        { key:'smile',    icon:'smile',    label:'Mood'     },
        { key:'heart',    icon:'heart',    label:'Gratitude'},
        { key:'wind',     icon:'wind',     label:'Breathe'  },
        { key:'sun',      icon:'sun',      label:'Morning'  },
        { key:'star',     icon:'star',     label:'Reflect'  },
        { key:'pen',      icon:'pen',      label:'Journal'  },
        { key:'camera',   icon:'camera',   label:'Capture'  },
      ],
      Body: [
        { key:'dumbbell', icon:'dumbbell', label:'Strength' },
        { key:'run',      icon:'run',      label:'Running'  },
        { key:'drop',     icon:'drop',     label:'Hydrate'  },
        { key:'heart',    icon:'heart',    label:'Health'   },
        { key:'leaf',     icon:'leaf',     label:'Nature'   },
        { key:'timer',    icon:'timer',    label:'Rest'     },
        { key:'zap',      icon:'zap',      label:'Power'    },
        { key:'shield',   icon:'shield',   label:'Defence'  },
        { key:'target',   icon:'target',   label:'Targets'  },
        { key:'trending', icon:'trending', label:'Growth'   },
      ],
      Learning: [
        { key:'book',     icon:'book',     label:'Read'     },
        { key:'pen',      icon:'pen',      label:'Write'    },
        { key:'star',     icon:'star',     label:'Study'    },
        { key:'target',   icon:'target',   label:'Focus'    },
        { key:'trending', icon:'trending', label:'Track'    },
        { key:'camera',   icon:'camera',   label:'Capture'  },
        { key:'music',    icon:'music',    label:'Listen'   },
        { key:'smile',    icon:'smile',    label:'Practice' },
        { key:'flame',    icon:'flame',    label:'Streak'   },
        { key:'coffee',   icon:'coffee',   label:'Study'    },
      ],
    };

    const ALL_ICONS = [
      ...CATALOGUE.Activity,
      ...CATALOGUE.Food.filter(i => !CATALOGUE.Activity.find(a => a.key === i.key)),
      ...CATALOGUE.Mind.filter(i => i.key === 'lotus' || i.key === 'moon' || i.key === 'music' || i.key === 'pen'),
      ...CATALOGUE.Learning.filter(i => i.key === 'book'),
    ].filter((v, i, a) => a.findIndex(x => x.key === v.key) === i);

    const CATEGORIES = ['All', 'Activity', 'Food', 'Mind', 'Body', 'Learning'];

    function getIcons(cat, query) {
      const pool = cat === 'All' ? ALL_ICONS : CATALOGUE[cat] || ALL_ICONS;
      if (!query) return pool;
      return pool.filter(i => i.label.toLowerCase().includes(query.toLowerCase()));
    }

    /* ── Main screen ───────────────────────────────────────────────────────── */
    function HabitScreen() {
      const [habitName, setHabitName]     = useState('Morning Run');
      const [note, setNote]               = useState('Start the day strong');
      const [selectedKey, setSelectedKey] = useState('run');
      const [sheetOpen, setSheetOpen]     = useState(true);
      const [activeTab, setActiveTab]     = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [mounted, setMounted]         = useState(false);
      const searchRef = useRef(null);

      useEffect(() => { const t = setTimeout(() => setMounted(true), 60); return () => clearTimeout(t); }, []);

      const canCreate = habitName.trim().length > 0;
      const selectedIcon = ALL_ICONS.find(h => h.key === selectedKey) || ALL_ICONS[0];
      const visibleIcons = getIcons(activeTab, searchQuery);

      const anim = (delay) => ({
        opacity:   mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(10px)',
        transition: `opacity 0.45s ease ${delay}ms, transform 0.45s ease ${delay}ms`,
      });

      const handleIconSelect = (h) => {
        setSelectedKey(h.key);
        setSheetOpen(false);
      };

      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#1A1A1A',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden', position: 'relative',
          paddingTop: 54,
        }}>

          {/* ── Top nav ── */}
          <div style={{
            display: 'flex', alignItems: 'center',
            justifyContent: 'space-between',
            padding: '10px 20px 0',
            ...anim(0),
          }}>
            <button style={{
              width: 38, height: 38, borderRadius: 11,
              border: '1.5px solid #333333', background: '#2A2A2A',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
            }}>
              <Icon name="chevLeft" size={18} color="#1A1A1A" />
            </button>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {[false, true, false].map((active, i) => (
                <div key={i} style={{
                  width: active ? 20 : 6, height: 6, borderRadius: 99,
                  background: active ? '#FF8C00' : '#444444',
                }} />
              ))}
            </div>
            <button style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontSize: 15, fontWeight: 500, color: '#666666',
              fontFamily: 'DM Sans, sans-serif',
            }}>Skip</button>
          </div>

          {/* ── Heading ── */}
          <div style={{ padding: '22px 24px 0', ...anim(100) }}>
            <h1 style={{
              fontFamily: 'DM Serif Display, serif',
              fontSize: 26, fontWeight: 400,
              color: '#F5F5F5', lineHeight: 1.25, letterSpacing: -0.2,
            }}>What habit will<br/>you build?</h1>
            <p style={{
              marginTop: 6, fontSize: 14.5, fontWeight: 400,
              color: '#666666', lineHeight: 1.5,
              fontFamily: 'DM Sans, sans-serif',
            }}>Start with one. You can add more later.</p>
          </div>

          {/* ── Input card ── */}
          <div style={{
            margin: '18px 20px 0',
            background: '#2A2A2A',
            borderRadius: 16,
            border: '1.5px solid #383838',
            overflow: 'hidden',
            ...anim(180),
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '14px 16px',
              borderBottom: '1px solid #333333',
            }}>
              {/* Icon badge — tapping opens sheet */}
              <button
                onClick={() => setSheetOpen(true)}
                style={{
                  width: 42, height: 42, borderRadius: 12,
                  background: 'rgba(255,140,0,0.15)',
                  border: '1.5px solid rgba(255,140,0,0.35)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0, cursor: 'pointer',
                  transition: 'transform 0.1s',
                }}
                onMouseDown={e => e.currentTarget.style.transform = 'scale(0.9)'}
                onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
                onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
              >
                <Icon name={selectedIcon.icon} size={19} color="#FF8C00" />
              </button>
              <input
                type="text" value={habitName}
                onChange={e => setHabitName(e.target.value)}
                placeholder="Habit name..."
                style={{
                  flex: 1, fontSize: 16, fontWeight: 600,
                  color: '#F5F5F5', lineHeight: '24px', caretColor: '#FF8C00',
                }}
              />
              {habitName.length > 0 && (
                <button onClick={() => setHabitName('')} style={{
                  width: 20, height: 20, borderRadius: 10,
                  background: '#444444', border: 'none', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                }}>
                  <Icon name="close" size={10} color="#888" strokeWidth={2.2} />
                </button>
              )}
            </div>
            <div style={{ padding: '10px 16px 12px', paddingLeft: 70 }}>
              <input
                type="text" value={note}
                onChange={e => setNote(e.target.value)}
                placeholder="Add a note (optional)"
                style={{
                  width: '100%', fontSize: 13.5, fontWeight: 400,
                  color: '#777777', lineHeight: '20px', caretColor: '#FF8C00',
                }}
              />
            </div>
          </div>

          {/* ── Spacer ── */}
          <div style={{ flex: 1 }} />

          {/* ── CTA ── */}
          <div style={{ padding: '0 24px 46px', ...anim(420) }}>
            <button
              disabled={!canCreate}
              style={{
                width: '100%', height: 54, borderRadius: 27, border: 'none',
                background: canCreate
                  ? 'linear-gradient(160deg, #FFB347 0%, #FF6500 100%)'
                  : '#2A2A2A',
                color: canCreate ? '#FFFFFF' : '#555555',
                fontSize: 16, fontWeight: 700,
                fontFamily: 'DM Sans, sans-serif',
                cursor: canCreate ? 'pointer' : 'not-allowed',
                boxShadow: canCreate ? '0 2px 8px rgba(255,101,0,0.25)' : 'none',
                transition: 'background 0.2s, color 0.2s, transform 0.1s',
              }}
              onMouseDown={e => { if (canCreate) e.currentTarget.style.transform = 'scale(0.97)'; }}
              onMouseUp={e => { e.currentTarget.style.transform = 'scale(1)'; }}
              onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
            >
              Create My First Habit
            </button>
          </div>

          {/* ══ BOTTOM SHEET ══════════════════════════════════════════════════ */}
          {sheetOpen && (
            <>
              {/* Scrim */}
              <div
                onClick={() => setSheetOpen(false)}
                style={{
                  position: 'absolute', inset: 0, zIndex: 20,
                  background: 'rgba(0,0,0,0.70)',
                  animation: 'scrimIn 0.25s ease',
                }}
              />

              {/* Sheet */}
              <div style={{
                position: 'absolute', bottom: 0, left: 0, right: 0,
                zIndex: 30,
                height: '62%',
                background: '#2A2A2A',
                borderRadius: '24px 24px 0 0',
                display: 'flex', flexDirection: 'column',
                overflow: 'hidden',
                animation: 'sheetUp 0.32s cubic-bezier(0.32,0.72,0,1)',
                boxShadow: '0 -2px 20px rgba(0,0,0,0.10)',
              }}>

                {/* Drag handle */}
                <div style={{
                  display: 'flex', justifyContent: 'center',
                  paddingTop: 10, paddingBottom: 6, flexShrink: 0,
                }}>
                  <div style={{
                    width: 36, height: 4, borderRadius: 2,
                    background: '#555555',
                  }} />
                </div>

                {/* Header */}
                <div style={{
                  padding: '4px 20px 0',
                  display: 'flex', alignItems: 'center',
                  justifyContent: 'space-between',
                  flexShrink: 0,
                }}>
                  <h3 style={{
                    fontFamily: 'DM Serif Display, serif',
                    fontSize: 20, fontWeight: 400, color: '#F5F5F5',
                  }}>Pick an icon</h3>
                  <button
                    onClick={() => setSheetOpen(false)}
                    style={{
                      width: 30, height: 30, borderRadius: 15,
                      background: '#3A3A3A', border: 'none', cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}
                  >
                    <Icon name="close" size={13} color="#AAAAAA" strokeWidth={2.2} />
                  </button>
                </div>

                {/* Search bar */}
                <div style={{
                  margin: '12px 20px 0',
                  background: '#333333',
                  borderRadius: 12,
                  display: 'flex', alignItems: 'center', gap: 8,
                  padding: '9px 12px',
                  flexShrink: 0,
                }}>
                  <Icon name="search" size={16} color="#666666" />
                  <input
                    ref={searchRef}
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Search icons..."
                    style={{
                      flex: 1, fontSize: 14, fontWeight: 400,
                      color: '#F5F5F5', caretColor: '#FF8C00',
                    }}
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} style={{
                      background: 'none', border: 'none', cursor: 'pointer',
                      display: 'flex', padding: 0,
                    }}>
                      <Icon name="close" size={13} color="#666666" strokeWidth={2.2} />
                    </button>
                  )}
                </div>

                {/* Category tabs */}
                <div style={{
                  display: 'flex', gap: 0,
                  overflowX: 'auto', flexShrink: 0,
                  padding: '10px 16px 0',
                  borderBottom: '1px solid #383838',
                }}
                  className="no-scroll"
                >
                  {CATEGORIES.map(cat => {
                    const active = cat === activeTab;
                    return (
                      <button
                        key={cat}
                        onClick={() => { setActiveTab(cat); setSearchQuery(''); }}
                        style={{
                          flexShrink: 0,
                          padding: '6px 14px 10px',
                          background: 'none', border: 'none', cursor: 'pointer',
                          fontSize: 13.5, fontWeight: active ? 600 : 400,
                          color: active ? '#FF8C00' : '#9E9E9E',
                          fontFamily: 'DM Sans, sans-serif',
                          borderBottom: active ? '2px solid #FF8C00' : '2px solid transparent',
                          marginBottom: -1,
                          transition: 'color 0.15s, border-color 0.15s',
                          whiteSpace: 'nowrap',
                        }}
                      >{cat}</button>
                    );
                  })}
                </div>

                {/* Icon grid */}
                <div
                  className="no-scroll"
                  style={{
                    flex: 1, overflowY: 'auto',
                    padding: '12px 20px 20px',
                    display: 'grid',
                    gridTemplateColumns: 'repeat(5, 1fr)',
                    gap: 10,
                    alignContent: 'start',
                  }}
                >
                  {visibleIcons.length === 0 ? (
                    <div style={{
                      gridColumn: '1 / -1',
                      textAlign: 'center', paddingTop: 24,
                      fontSize: 13, color: '#666666',
                      fontFamily: 'DM Sans, sans-serif',
                    }}>No icons found</div>
                  ) : visibleIcons.map((h) => {
                    const active = h.key === selectedKey;
                    return (
                      <button
                        key={h.key + h.label}
                        onClick={() => handleIconSelect(h)}
                        style={{
                          width: '100%',
                          aspectRatio: '1',
                          borderRadius: 14,
                          border: active ? '2px solid #FF8C00' : '1.5px solid #383838',
                          background: active ? 'rgba(255,140,0,0.15)' : '#333333',
                          display: 'flex', flexDirection: 'column',
                          alignItems: 'center', justifyContent: 'center',
                          gap: 4, cursor: 'pointer',
                          transition: 'border-color 0.15s, background 0.15s, transform 0.1s',
                          padding: '8px 4px 6px',
                          boxShadow: active ? '0 0 0 3px rgba(255,140,0,0.15)' : 'none',
                        }}
                        onMouseDown={e => e.currentTarget.style.transform = 'scale(0.88)'}
                        onMouseUp={e => e.currentTarget.style.transform = 'scale(1)'}
                        onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                      >
                        <Icon
                          name={h.icon} size={22}
                          color={active ? '#FF8C00' : '#666666'}
                          strokeWidth={active ? 2 : 1.8}
                        />
                        <span style={{
                          fontSize: 10, fontWeight: active ? 600 : 400,
                          color: active ? '#FF8C00' : '#555555',
                          fontFamily: 'DM Sans, sans-serif',
                          lineHeight: 1,
                        }}>{h.label}</span>
                      </button>
                    );
                  })}
                </div>

              </div>
            </>
          )}

        </div>
      );
    }

    /* ── Root ──────────────────────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%', background: '#111111',
        }}>
          <IOSDevice width={390} height={844} dark={true}>
            <HabitScreen />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
