<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreakUp — 2.5 Home: 1 Habit Just Completed (Dark)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── FAB pop ── */
    @keyframes fabPop {
      0%   { transform: scale(0.7); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Toast slides down from top ── */
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-56px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-56px); }
    }

    /* ── Card enters ── */
    @keyframes cardPop {
      0%   { opacity: 0; transform: scale(0.96) translateY(6px); }
      60%  { transform: scale(1.015) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Ring fill burst ── */
    @keyframes ringBurst {
      0%   { transform: scale(0.6); opacity: 0; }
      55%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── Confetti pieces ── */
    @keyframes confettiFall1 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(-18px, 80px) rotate(210deg); opacity: 0.7; }
    }
    @keyframes confettiFall2 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(22px, 70px)  rotate(-180deg); opacity: 0.6; }
    }
    @keyframes confettiFall3 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(-8px,  90px) rotate(135deg);  opacity: 0.75; }
    }
    @keyframes confettiFall4 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(30px,  60px) rotate(-240deg); opacity: 0.5; }
    }
    @keyframes confettiFall5 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(-25px, 50px) rotate(160deg);  opacity: 0.8; }
    }
    @keyframes confettiFall6 {
      0%   { transform: translate(0,0)   rotate(0deg);   opacity: 1; }
      100% { transform: translate(10px,  95px) rotate(-120deg); opacity: 0.65; }
    }

    /* Fade in screen */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Progress bar fill sweep */
    @keyframes barFill {
      from { width: 0%; }
      to   { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─────────────────────────────────────────────────
       Nav icons
    ───────────────────────────────────────────────── */
    function NavFlame({ active }) {
      const c = active ? '#FF740D' : '#4A4A4A';
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"
            fill={active ? '#FF740D' : 'none'}
            stroke={c} strokeWidth="1.8"
            strokeLinecap="round" strokeLinejoin="round"/>
          {active && <path d="M12 11c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z"
            fill="white" opacity="0.4"/>}
        </svg>
      );
    }
    function NavBar({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3"  y="3"  width="7" height="7" rx="1.5"/>
          <rect x="14" y="3"  width="7" height="7" rx="1.5"/>
          <rect x="3"  y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      );
    }
    function NavGear({ color }) {
      return (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      );
    }

    /* ─────────────────────────────────────────────────
       Confetti overlay — frozen mid-burst over top 40%
    ───────────────────────────────────────────────── */
    const CONFETTI = [
      /* shape, color, top%, left%, animDur, delay, size, anim */
      { shape: 'rect',    color: '#FF740D', top: 8,  left: 12, dur: 1.1, delay: 0,    w: 8,  h: 5,  anim: 'confettiFall1' },
      { shape: 'circle',  color: '#FFD700', top: 5,  left: 35, dur: 1.3, delay: 0.08, w: 7,  h: 7,  anim: 'confettiFall2' },
      { shape: 'rect',    color: '#FFFFFF', top: 12, left: 58, dur: 1.0, delay: 0.04, w: 6,  h: 9,  anim: 'confettiFall3' },
      { shape: 'rect',    color: '#FFD700', top: 4,  left: 75, dur: 1.4, delay: 0.12, w: 10, h: 5,  anim: 'confettiFall4' },
      { shape: 'circle',  color: '#FF740D', top: 9,  left: 88, dur: 1.2, delay: 0.06, w: 6,  h: 6,  anim: 'confettiFall5' },
      { shape: 'rect',    color: '#FFFFFF', top: 3,  left: 50, dur: 0.95,delay: 0.15, w: 7,  h: 4,  anim: 'confettiFall6' },
      { shape: 'rect',    color: '#FF740D', top: 15, left: 25, dur: 1.1, delay: 0.2,  w: 5,  h: 8,  anim: 'confettiFall2' },
      { shape: 'circle',  color: '#FFD700', top: 7,  left: 65, dur: 1.3, delay: 0.18, w: 8,  h: 8,  anim: 'confettiFall1' },
      { shape: 'rect',    color: '#FFFFFF', top: 18, left: 82, dur: 1.05,delay: 0.09, w: 6,  h: 6,  anim: 'confettiFall3' },
      { shape: 'rect',    color: '#FFD700', top: 11, left: 6,  dur: 1.2, delay: 0.22, w: 9,  h: 4,  anim: 'confettiFall5' },
      { shape: 'circle',  color: '#FF740D', top: 20, left: 44, dur: 1.0, delay: 0.03, w: 5,  h: 5,  anim: 'confettiFall4' },
      { shape: 'rect',    color: '#FFFFFF', top: 6,  left: 92, dur: 1.15,delay: 0.16, w: 7,  h: 5,  anim: 'confettiFall6' },
      { shape: 'rect',    color: '#FFD700', top: 22, left: 18, dur: 1.25,delay: 0.07, w: 8,  h: 6,  anim: 'confettiFall2' },
      { shape: 'circle',  color: '#FF740D', top: 16, left: 72, dur: 1.1, delay: 0.14, w: 6,  h: 6,  anim: 'confettiFall1' },
      { shape: 'rect',    color: '#FFFFFF', top: 25, left: 55, dur: 0.9, delay: 0.21, w: 5,  h: 9,  anim: 'confettiFall3' },
    ];

    function ConfettiOverlay() {
      return (
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0,
          height: '40%',
          pointerEvents: 'none',
          zIndex: 30,
          overflow: 'hidden',
        }}>
          {CONFETTI.map((c, i) => (
            <div key={i} style={{
              position: 'absolute',
              top: `${c.top}%`,
              left: `${c.left}%`,
              width: c.w,
              height: c.h,
              background: c.color,
              borderRadius: c.shape === 'circle' ? '50%' : 2,
              opacity: 0.88,
              animation: `${c.anim} ${c.dur}s ease-out ${c.delay}s both`,
              animationPlayState: 'paused',
              animationDelay: '0s',
              /* Freeze mid-burst: apply at 60% progress via fill-mode trick */
              animationFillMode: 'both',
            }} />
          ))}
        </div>
      );
    }

    /* ─────────────────────────────────────────────────
       Toast banner
    ───────────────────────────────────────────────── */
    function Toast({ visible }) {
      return (
        <div style={{
          position: 'absolute',
          top: 62, left: 16, right: 16,
          zIndex: 50,
          animation: visible
            ? 'toastIn 0.38s cubic-bezier(0.22,1,0.36,1) both'
            : 'toastOut 0.3s ease-in both',
          pointerEvents: 'none',
        }}>
          <div style={{
            background: '#2A2A2A',
            borderRadius: 14,
            border: '1.5px solid #383838',
            padding: '12px 16px',
            display: 'flex', alignItems: 'center', gap: 10,
          }}>
            {/* Streak icon */}
            <div style={{
              width: 36, height: 36, borderRadius: 10,
              background: '#3A2A1A',
              flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 18,
            }}>🔥</div>

            <div style={{ flex: 1 }}>
              <p style={{
                fontSize: 14, fontWeight: 700,
                color: '#FF740D',
                fontFamily: 'DM Sans, sans-serif',
                lineHeight: 1.25,
              }}>4 day streak! Keep going!</p>
              <p style={{
                fontSize: 11.5, fontWeight: 400,
                color: '#666666',
                fontFamily: 'DM Sans, sans-serif',
                marginTop: 1,
              }}>Morning Run · completed just now</p>
            </div>

            {/* Green check badge */}
            <div style={{
              width: 22, height: 22, borderRadius: 11,
              background: '#4CAF50',
              flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                stroke="white" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────
       Home screen
    ───────────────────────────────────────────────── */
    function HomeScreen() {
      const [mounted,      setMounted]      = useState(false);
      const [toastVisible, setToastVisible] = useState(true);

      useEffect(() => {
        const t1 = setTimeout(() => setMounted(true), 60);
        /* Auto-dismiss toast after 3.4 s */
        const t2 = setTimeout(() => setToastVisible(false), 3400);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);

      const anim = (delayMs) => ({
        opacity:   mounted ? 1 : 0,
        transform: mounted ? 'translateY(0)' : 'translateY(10px)',
        transition: `opacity 0.42s ease ${delayMs}ms, transform 0.42s ease ${delayMs}ms`,
      });

      return (
        <div style={{
          width: '100%', height: '100%',
          background: '#1A1A1A',
          display: 'flex', flexDirection: 'column',
          overflow: 'hidden',
          paddingTop: 54,
          position: 'relative',
          fontFamily: 'DM Sans, sans-serif',
        }}>

          {/* ── Confetti ──────────────────────────── */}
          <ConfettiOverlay />

          {/* ── Toast ─────────────────────────────── */}
          <Toast visible={toastVisible} />

          {/* ── Header ────────────────────────────── */}
          <div style={{
            display: 'flex', alignItems: 'center',
            justifyContent: 'space-between',
            padding: '14px 20px 0',
            ...anim(0),
          }}>
            <div>
              <p style={{
                fontSize: 12.5, fontWeight: 500,
                color: '#666666', marginBottom: 2, letterSpacing: 0.1,
              }}>Monday, May 12</p>
              <h2 style={{
                fontFamily: 'DM Serif Display, serif',
                fontSize: 22, fontWeight: 400,
                color: '#F5F5F5', lineHeight: 1.2,
              }}>Good morning 👋</h2>
            </div>
            <div style={{
              width: 42, height: 42, borderRadius: 21,
              background: '#FF740D',
              flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: '#FFFFFF' }}>A</span>
            </div>
          </div>

          {/* ── Progress summary card ─────────────── */}
          <div style={{
            margin: '16px 20px 0',
            background: '#2A2A2A',
            borderRadius: 16,
            border: '1.5px solid #333333',
            padding: '13px 16px',
            ...anim(90),
          }}>
            <div style={{
              display: 'flex', justifyContent: 'space-between',
              alignItems: 'baseline', marginBottom: 10,
            }}>
              <p style={{ fontSize: 14.5, fontWeight: 600, color: '#F5F5F5' }}>
                1 of 1 done today
              </p>
              <span style={{ fontSize: 12.5, fontWeight: 600, color: '#4CAF50' }}>
                All done! 🎉
              </span>
            </div>

            {/* Full progress bar + check */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{
                flex: 1, height: 4, borderRadius: 99,
                background: '#333333', overflow: 'hidden',
              }}>
                <div style={{
                  height: '100%', borderRadius: 99,
                  background: '#FF740D',
                  animation: 'barFill 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.2s both',
                }} />
              </div>
              {/* ✓ end cap */}
              <div style={{
                width: 16, height: 16, borderRadius: 8,
                background: '#FF740D',
                flexShrink: 0,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
                  stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
            </div>
          </div>

          {/* ── Section label ─────────────────────── */}
          <div style={{ padding: '20px 20px 10px', ...anim(150) }}>
            <p style={{
              fontSize: 10.5, fontWeight: 600,
              color: '#555555', letterSpacing: 0.9,
              textTransform: 'uppercase',
            }}>Today</p>
          </div>

          {/* ── Completed habit card ──────────────── */}
          <div style={{ padding: '0 20px', ...anim(210) }}>
            <div style={{
              borderRadius: 16,
              background: '#1E2E1E',
              border: '1.5px solid #2A4A2A',
              borderLeft: '4px solid #4CAF50',
              padding: '14px 14px 14px 12px',
              display: 'flex', alignItems: 'center', gap: 12,
              animation: 'cardPop 0.42s cubic-bezier(0.22,1,0.36,1) 0.1s both',
            }}>

              {/* Emoji badge */}
              <div style={{
                width: 46, height: 46, borderRadius: 13,
                background: '#1A3A1A',
                flexShrink: 0,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 22,
              }}>🏃</div>

              {/* Text */}
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{
                  fontSize: 15.5, fontWeight: 700,
                  color: '#F5F5F5',
                  fontFamily: 'DM Sans, sans-serif',
                  lineHeight: 1.25,
                }}>Morning Run</p>
                <div style={{ display: 'flex', alignItems: 'center', gap: 3, marginTop: 3 }}>
                  <span style={{ fontSize: 13, lineHeight: 1 }}>🔥</span>
                  <span style={{
                    fontSize: 12.5, fontWeight: 600,
                    color: '#FF740D',
                    fontFamily: 'DM Sans, sans-serif',
                  }}>4 day streak</span>
                </div>
                <p style={{
                  fontSize: 11, fontWeight: 400,
                  color: '#4CAF50', marginTop: 4,
                  fontFamily: 'DM Sans, sans-serif',
                }}>Completed today ✓</p>
              </div>

              {/* Filled green ring with checkmark */}
              <div style={{
                width: 44, height: 44,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                flexShrink: 0,
              }}>
                <div style={{
                  width: 28, height: 28, borderRadius: 14,
                  background: '#4CAF50',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  animation: 'ringBurst 0.45s cubic-bezier(0.22,1,0.36,1) 0.05s both',
                }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div style={{ flex: 1 }} />

          {/* ── Bottom nav ────────────────────────── */}
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            height: 82,
            background: '#1A1A1A',
            borderTop: '1px solid #2E2E2E',
            display: 'flex', alignItems: 'flex-start',
            justifyContent: 'space-around',
            paddingTop: 12,
            zIndex: 10,
          }}>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavFlame active={true} />
              <span style={{ fontSize: 10.5, fontWeight: 600, color: '#FF740D' }}>Home</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavBar color="#4A4A4A" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#4A4A4A' }}>Stats</span>
            </button>
            <button style={{ background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <NavGear color="#4A4A4A" />
              <span style={{ fontSize: 10.5, fontWeight: 400, color: '#4A4A4A' }}>Settings</span>
            </button>
          </div>

          {/* ── FAB ───────────────────────────────── */}
          <button style={{
            position: 'absolute', bottom: 96, right: 20,
            width: 56, height: 56, borderRadius: 28,
            background: '#FF740D',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            animation: 'fabPop 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.3s both',
            zIndex: 20,
          }}
          onMouseDown={e => e.currentTarget.style.transform = 'scale(0.92)'}
          onMouseUp={e   => e.currentTarget.style.transform = 'scale(1)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="white" strokeWidth="2.6" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>

        </div>
      );
    }

    /* ─────────────────────────────────────────────────
       Root
    ───────────────────────────────────────────────── */
    function App() {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          minHeight: '100vh', width: '100%',
          background: '#111111',
        }}>
          <IOSDevice width={390} height={844} dark={true}>
            <HomeScreen />
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
